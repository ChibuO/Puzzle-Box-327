<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width" , inital-scale="1.0">
    <title>Maze</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./mazeStyles.css">
    <link rel="stylesheet" href="./skylineStyles.css">
    <link rel="stylesheet" href="./dial.css">
</head>

<body>
    <div id="main-game">
        <div id="welcome-screen" class="screen">
            <input autofocus type="text" id="passkey_txtbox" name="passkey">
        </div>

        <div class="box-down-screen screen">
            <h1>SET BOX DOWN</h1>
        </div>

        <div id="maze-screen" class="screen">
            <div class="recal-container">
                <input class="btn_class recal-btn" type="button" onclick="onRecalibrate()" value="Recalibrate" />
            </div>

            <div id="maze_box">
                <div id="mazeContainer">
                    <canvas id="mazeCanvas" height="400" width="400"></canvas>
                </div>
            </div>
        </div>

        <div id="neopixel-screen" class="screen">
            <div class="strip-container">
                <div class="strip" id="first-strip"></div>
                <div class="strip" id="second-strip"></div>
                <div class="strip" id="third-strip"></div>
            </div>
        </div>

        <div id="weight-screen" class="screen">
            <div class="recal-container">
                <input class="btn_class recal-btn" type="button" onclick="onRecalibrate()" value="Recalibrate" />
            </div>

            <div id="skyline_box">
                <div id="skylineContainer">
                    <button id="run-btn">Run (c)</button>
                    <canvas id="skylineCanvas" height="100" width="100"></canvas>
                    <button id="reverse-btn">Reverse (b)</button>
                </div>
            </div>  
        </div>

        <div id="light-screen" class="screen">
            <div class="light-div" id="lightside">
                <h2 id="lightside-clue"></h2>
                <h2 id="light-second-h2" style="color: black;">Turn back</h2>
            </div>
            <div class="light-div" id="darkside">
                <h2 id="darkside-clue">~</h2>
                <h2 id="light-second-h2" style="color: white;">all to Zero</h2>
            </div>
        </div>

        <div id="tilt-screen" class="screen">
            <div class="recal-container">
                <input class="btn_class recal-btn" type="button" onclick="onRecalibrate()" value="Recalibrate" />
            </div>
            <div id="dials-div">
                <div class="dial-div" id="dial-div1">
                    <h3>triangle</h3>
                    <input class="btn_class" id="dial1-btn" type="button" onclick="toggleDialLock(this, 1)" value="Unlock" />
                </div>
                <div class="dial-div" id="dial-div2">
                    <h3>square</h3>
                    <input class="btn_class" id="dial2-btn" type="button" onclick="toggleDialLock(this, 2)" value="Unlock" />
                </div>
                <div class="dial-div" id="dial-div3">
                    <h3>heptagon</h3>
                    <input class="btn_class" id="dial3-btn" type="button" onclick="toggleDialLock(this, 3)" value="Unlock" />
                </div>
            </div>
            <div id="behind-dials-div">
                <img id="knob-img"  src="" alt=""/>
            </div>
        </div>

        <div id="end-screen" class="screen">
            <h1>Congratulations!</h1>
            <!-- <iframe id="victory-vid" src="https://www.youtube.com/embed/TsaDzekhPMw?autoplay=0&mute=0&loop=1&playlist=TsaDzekhPMw" frameborder="0"></iframe> -->
        </div>

    </div>

    <div id="puzzles-container">
        <span id="admin-btn" onclick="toggleAdminPanel()">&#9776;</span>
        <div id="puzzles">
            <h3 id="key_lbl">Password</h3>
            <h3 id="maze_lbl">Maze</h3>
            <h3 id="neo_lbl">Freqs</h3>
            <h3 id="knobs_lbl">Intensities</h3>
            <h3 id="weights_lbl">Weights</h3>
            <h3 id="dark_lbl">Dark/Light</h3>
            <h3 id="tilt_lbl">Tilt</h3>
            <h3 id="final_lbl">Turn It</h3>
            <input class="btn_class" id="skipBtn" type="button" onclick="skipPuzzle()" value="Skip Puzzle" />
        </div>
    </div>

    <h2 id="status_lbl">~</h2>

    <script src="./websocket.js"></script>
    <script src="./script.js"></script>
    <script src="./mazeCode.js"></script>
    <script src="./skylineCode.js"></script>
    <script src="./dial.js"></script>
</body>

</html>
